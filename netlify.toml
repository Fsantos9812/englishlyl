# Configuracion de Netlify.
#
# VARIABLES DE ENTORNO NECESARIAS (Site settings -> Environment variables):
#   SESION_SECRETO   cadena larga y secreta para firmar los tokens de sesion
#   PROFE_USUARIO    usuario del profe para entrar a /profe.html
#   PROFE_CLAVE      contrasena del profe
#
# Sin SESION_SECRETO las funciones responden 503 a proposito: mejor cerrado
# que abierto. Los alumnos NO van en variables: los crea el profe desde el panel.
[build]
  publish = "."

# Las funciones necesitan que Netlify corra "npm install" (por @netlify/blobs).
# Eso pasa solo si el sitio esta conectado a un repo, o si al soltar la carpeta
# Netlify detecta el package.json y ejecuta el build.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Cache
# assets/ se sirve con cache eterno y se versiona por query string (?v=N).
# Si editas lesson.js o lesson.css, subi el numero en los <link>/<script>
# de las lecciones para que los alumnos reciban la version nueva.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML siempre se revalida: publicar una leccion nueva se ve al instante.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El manifiesto tampoco se cachea: si no, agregar una leccion no se ve
# hasta que al alumno se le venza la copia vieja.
[[headers]]
  for = "/lessons.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El mapa de audios se revalida por el mismo motivo que lessons.json: cambia
# cada vez que se generan audios nuevos. Los .mp3 no: su nombre sale de la
# frase, asi que un archivo dado nunca cambia de contenido y le sirve el
# cache inmutable de /assets/*.
[[headers]]
  for = "/audios.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El panel del profe no se indexa ni se cachea.
[[headers]]
  for = "/profe.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# El service worker NUNCA se cachea: es el que decide como se actualiza
# todo lo demas, asi que una copia vieja congela la app entera.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nota: no se restringe "microphone" a proposito — las lecciones lo necesitan
    # y una politica mas estricta rompe el embebido en iframes (Google Sites).
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=()"

# ---------------------------------------------------------------------------
# URLs cortas: /leccion-01 -> /leccion-01-saludos.html
# (Netlify ya sirve /leccion-01-saludos sin el .html por su cuenta.)
# ---------------------------------------------------------------------------
# Atajo a la leccion actual. Los de leccion-01..04 apuntaban a archivos que ya
# no existen y devolvian 404: al renombrar o borrar una leccion hay que revisar
# esta lista, no se actualiza sola.
[[redirects]]
  from = "/leccion-01"
  to = "/leccion-01-familia-edades.html"
  status = 301

# La documentacion no se sirve. El README describe la arquitectura y dice, entre
# otras cosas, que el login no tiene limite de intentos: es informacion util para
# quien quiera atacarlo y no le sirve de nada a un alumno.
# force = true es imprescindible: sin eso, un archivo que existe en la carpeta
# publicada le gana a la regla y la redireccion nunca se aplica.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PENDIENTES.md"
  to = "/404.html"
  status = 404
  force = true
