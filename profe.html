<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del profe</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="assets/lesson.css?v=56">
<style>
  .wrap{max-width:900px;}
  .campos{display:flex; gap:14px; flex-wrap:wrap;}
  .campos > div{flex:1 1 190px;}
  .campos label{font-size:.8rem; font-weight:600; color:var(--muted);}
  .campos input{width:100%; padding:11px 12px; border:1px solid var(--border);
    border-radius:8px; background:var(--card); color:var(--ink);
    font-size:1rem; min-height:44px; margin:6px 0 4px;}
  .btn-primario{background:var(--accent-fill); color:var(--on-accent);}
  .btn-primario:hover{background:var(--accent-hover);}
  .btn-primario[disabled]{opacity:.6; cursor:default;}
  .alumno-cab{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .alumno-cab h3{margin:0; font-size:1.05rem; color:var(--accent);}
  .alumno-meta{font-size:.76rem; color:var(--muted);}
  .acciones{display:flex; gap:6px; flex-wrap:wrap;}
  .acciones button{font-size:.75rem; padding:5px 9px; background:var(--card); color:var(--ink);
    border:1px solid var(--border);}
  .acciones button:hover{background:var(--surface-2);}
  .acciones .peligro{color:var(--bad); border-color:var(--bad-border);}
  table.notas{width:100%; border-collapse:collapse; font-size:.85rem; margin-top:10px;}
  table.notas th{text-align:left; font-size:.78rem; color:var(--muted); padding:4px 6px; font-weight:600;}
  table.notas td{padding:5px 6px; border-top:1px solid var(--border);}
  .pill{display:inline-block; font-size:.78rem; padding:2px 8px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .pill.gris{background:var(--surface-2); color:var(--muted-2);}
  .audios{list-style:none; padding:0; margin:8px 0 0;}
  .audios li{display:flex; align-items:center; gap:10px; padding:6px 0;
    border-top:1px solid var(--border); flex-wrap:wrap;}
  .audios .frase{flex:1; min-width:170px; font-size:.8rem;}
  .credencial{background:var(--good-soft); border:1px solid var(--good-border); border-radius:8px;
    padding:12px 14px; margin-top:12px; font-size:.9rem;}
  .credencial code{background:var(--card); border:1px solid var(--border); border-radius:6px;
    padding:2px 8px; font-size:1rem; font-weight:700;}
  .credencial-barra{display:flex; justify-content:space-between; align-items:center; gap:12px;
    flex-wrap:wrap; margin-top:14px; padding-bottom:4px; border-bottom:1px solid var(--border);}
  .credencial-barra span{font-size:.78rem; font-weight:600; color:var(--muted);}
  .credencial-barra button{font-size:.75rem; padding:5px 9px; background:var(--card); color:var(--ink);
    border:1px solid var(--border);}
  .credencial-barra button:hover{background:var(--surface-2);}
  .vistas{display:flex; justify-content:space-between; align-items:center; gap:14px;
    flex-wrap:wrap; margin-bottom:16px;}
  .segmentado{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .segmentado button{background:var(--card); color:var(--muted); border:none; border-radius:0;
    font-size:.82rem; padding:8px 14px;}
  .segmentado button + button{border-left:1px solid var(--border);}
  .segmentado button:hover{background:var(--surface-2); color:var(--ink);}
  .segmentado button.activo{background:var(--accent-fill); color:var(--on-accent);}
  .filtro{display:flex; align-items:center; gap:9px; font-size:.83rem; color:var(--ink);
    cursor:pointer; min-height:44px; padding:0 4px;}
  .herramientas{display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%;}
  .buscar{flex:1 1 180px; min-height:44px; padding:10px 12px; font-size:1rem;
    border:1px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--ink);}
  .orden{display:flex; align-items:center; gap:7px; font-size:.83rem; color:var(--muted);
    min-height:44px;}
  .orden select{min-height:44px; font-size:.85rem; padding:6px 8px; border-radius:8px;
    border:1px solid var(--border); background:var(--card); color:var(--ink);}
  /* Motivo por el que un alumno sube en la lista. */
  .pill.aviso{background:var(--surface-2); color:var(--warn);}
  /* Venía con el tamaño por defecto del navegador: 13x13, contra un mínimo de 44.
     La etiqueta entera es el área tocable; la tilde sólo tiene que verse. */
  .filtro input[type=checkbox]{width:22px; height:22px; flex:none; cursor:pointer;}
  .grupo{border:1px solid var(--border); border-radius:10px; margin-top:8px; overflow:hidden;}
  .grupo-cab{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--card); border:none; border-radius:0; padding:10px 14px; font-size:.88rem;
    color:var(--ink);}
  .grupo-cab:hover{background:var(--bg);}
  .flecha{color:var(--muted); font-size:.8rem; width:.8rem;}
  .grupo-titulo{flex:1; font-weight:600;}
  .grupo-conteo{font-size:.76rem; color:var(--muted); white-space:nowrap;}
  .grupo-conteo.hay-pendientes{color:var(--accent); font-weight:600;}
  .grupo-cuerpo{padding:4px 14px 12px; border-top:1px solid var(--border);}
  .audios li input[type=checkbox]{width:22px; height:22px; flex:none; cursor:pointer;}
  /* La tilde sola medía 17px. La etiqueta que la envuelve es el área tocable de
     44, sin agrandar el dibujo ni estirar la fila. */
  .tilde-caja{display:inline-flex; align-items:center; justify-content:center;
    min-width:44px; min-height:44px; flex:none; cursor:pointer;}
  .audios li.escuchado .frase{color:var(--muted); text-decoration:line-through;}
  /* Los intentos de Repeat van marcados y con qué escuchó el reconocimiento. */
  .audios li.repeat-intento{background:var(--accent-soft); margin:0 -14px; padding:6px 14px; border-radius:6px;}
  .audios li.repeat-intento .frase{color:var(--accent); font-weight:600;}
  .dicho{display:block; width:100%; font-size:.78rem; color:var(--muted); font-style:italic; margin:2px 0 0 54px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="alumno-cab">
      <h1>📋 Panel del profe</h1>
      <button class="btn-reset" id="salir" type="button" hidden>Salir</button>
    </div>
    <p class="hint" id="resumen"></p>
  </header>

  <main>
  <div class="card" id="caja-login">
    <div class="campos">
      <div>
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" spellcheck="false">
      </div>
      <div>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password">
      </div>
    </div>
    <div class="row">
      <button class="btn-primario" id="entrar" type="button">Entrar</button>
    </div>
    <div class="status" id="login-estado" aria-live="polite"></div>
  </div>

  <div id="caja-panel" hidden>
    <h2>➕ Nuevo alumno</h2>
    <div class="card">
      <div class="campos">
        <div>
          <label for="nuevo-nombre">Nombre y apellido</label>
          <input type="text" id="nuevo-nombre" placeholder="Ana Gómez">
        </div>
        <div>
          <label for="nuevo-usuario">Usuario (opcional)</label>
          <input type="text" id="nuevo-usuario" placeholder="se arma del nombre" spellcheck="false">
        </div>
      </div>
      <div class="row">
        <button class="btn-primario" id="crear" type="button">Crear alumno</button>
      </div>
      <div class="status" id="crear-estado" aria-live="polite"></div>
      <div id="credencial"></div>
    </div>

    <h2>👥 Alumnos</h2>
    <div id="lista"></div>
  </div>

  </main>

  <footer>Esta página no se guarda para uso offline y no la indexa ningún buscador.</footer>
</div>
<script>window.AUTH_CLAVE = "lecciones:sesion-profe";</script>
<script src="assets/auth.js?v=56" defer></script>
<script src="assets/modal.js?v=56" defer></script>
<script src="assets/profe.js?v=56" defer></script>
</body>
</html>
